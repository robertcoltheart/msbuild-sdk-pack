name: Build

on:
  pull_request:
  push:
    branches:
      - master

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v7
        with:
            dotnet-version: |
              10.x

      - name: Build
        run: ./build.sh
